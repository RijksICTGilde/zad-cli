version: 2
updates:
  # uv, not pip: CI installs from uv.lock, which the pip updater does not
  # maintain. Replaces pip rather than joining it -- both target pyproject.toml.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all-actions:
        patterns:
          - "*"
