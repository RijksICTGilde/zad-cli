name: Release binaries

# Standalone builds of `zadctl`, so nobody has to install Python to use the CLI.
#
# One runner per platform, because neither PyInstaller nor Nuitka can cross-compile: a
# macOS binary has to be produced on macOS. That is the price of shipping a Python runtime
# with the program, and it is why a Go CLI gets away with a single `for` loop here.
#
# Nuitka rather than PyInstaller: it compiles the CLI's own code to machine code and
# caches its unpacked runtime, so startup is ~0.25s instead of ~0.8s. A one-file build
# that unpacks itself on every invocation is noticeable on a command you run all day.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach the binaries to"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux_amd64
            binary: zadctl
          - os: macos-14
            label: darwin_arm64
            binary: zadctl
          - os: macos-13
            label: darwin_amd64
            binary: zadctl
          - os: windows-latest
            label: windows_amd64
            binary: zadctl.exe

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --frozen

      # The version the binary reports comes from the tag, so a downloaded build can say
      # what it is without anyone remembering to bump a constant.
      - name: Build
        shell: bash
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          uv run --with nuitka python -m nuitka \
            --standalone --onefile --onefile-cache-mode=cached \
            --company-name=RijksICTGilde --product-name=zadctl \
            --file-version="$VERSION" --product-version="$VERSION" \
            --output-filename="${{ matrix.binary }}" --output-dir=dist \
            --include-package=zad_cli \
            --include-data-files=api/upstream-openapi.json=zad_cli/api/upstream-openapi.json \
            --include-data-files=src/zad_cli/data/services-snapshot.json=zad_cli/data/services-snapshot.json \
            --assume-yes-for-downloads \
            src/zad_cli/__main__.py

      # Proves the thing that is about to be published actually runs, and that the
      # vendored spec and service catalogue came along: those are read from paths next to
      # the modules, which a bundler can silently leave behind.
      - name: Smoke test
        shell: bash
        run: |
          cd dist
          ./${{ matrix.binary }} --version
          ./${{ matrix.binary }} --help > /dev/null
          ZAD_CATALOG_OFFLINE=1 ./${{ matrix.binary }} service list > /dev/null

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "zadctl_${{ matrix.label }}.zip" "${{ matrix.binary }}"
          else
            tar -czf "zadctl_${{ matrix.label }}.tar.gz" "${{ matrix.binary }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: zadctl_${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Checksums so a download can be verified, and so a mirror or proxy that quietly
      # changed the bytes is visible rather than assumed away.
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag || github.ref_name }}" dist/* \
            --clobber --repo "${{ github.repository }}"
