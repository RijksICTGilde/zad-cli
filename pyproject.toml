[project]
name = "zad-cli"
version = "1.0.0"
description = "CLI for ZAD (Zelfservice Applicatie Deployment)"
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.11"
authors = [
    { name = "Rijks ICT Gilde" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.27.0",
    "rich>=15.0.0",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "pydantic>=2.13.4",
]

[project.urls]
Repository = "https://github.com/RijksICTGilde/zad-cli"
Issues = "https://github.com/RijksICTGilde/zad-cli/issues"

[project.scripts]
zad = "zad_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["src/zad_cli"]

# The vendored OpenAPI spec is read at runtime (rollout parameters, request schemas)
# and lives at api/upstream-openapi.json because that is where the api-sync workflow
# writes it. Ship that single copy next to the module that reads it.
[tool.hatch.build.targets.wheel.force-include]
"api/upstream-openapi.json" = "zad_cli/api/upstream-openapi.json"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/zad_cli/__init__.py:__version__"]
branch = "main"
commit_message = "chore(release): {version}"
build_command = ""
upload_to_pypi = false
tag_format = "v{version}"
# 1.0 is a deliberate major: `service add`/`service delete` were removed with the
# endpoints behind them. Releases from here follow "additive within a major".
major_on_zero = true
allow_zero_version = true
