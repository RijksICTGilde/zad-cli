[project]
name = "zad-cli"
version = "0.12.0"
description = "CLI for ZAD (Zelfservice Applicatie Deployment)"
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.11"
authors = [
    { name = "Rijks ICT Gilde" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.27.0",
    "rich>=15.0.0",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "pydantic>=2.13.4",
]

[project.urls]
Repository = "https://github.com/RijksICTGilde/zad-cli"
Issues = "https://github.com/RijksICTGilde/zad-cli/issues"

[project.scripts]
# Two names for one entry point. `zadctl` is the name to use; `zad` stays because it is
# what every existing script, playbook and pinned pipeline types, and breaking those to
# rename a command would be a cost paid by other teams for a change they did not ask for.
zadctl = "zad_cli.cli:main"
zad = "zad_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["src/zad_cli"]

# The vendored OpenAPI spec is read at runtime (rollout parameters, request schemas)
# and lives at api/upstream-openapi.json because that is where the api-sync workflow
# writes it. Ship that single copy next to the module that reads it.
[tool.hatch.build.targets.wheel.force-include]
"api/upstream-openapi.json" = "zad_cli/api/upstream-openapi.json"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/zad_cli/__init__.py:__version__"]
branch = "main"
commit_message = "chore(release): {version}"
build_command = ""
upload_to_pypi = false
tag_format = "v{version}"
# Deliberately 0.x. The API this wraps is still moving, and three breaking changes landed
# in the four days around 12 August alone -- each one a discovery that a command had never
# worked. Under 0.x semver allows that; under 1.x every one of them needs a major release
# and a promise we would then be breaking. false, so a breaking change bumps the minor
# (0.10 -> 0.11) instead of declaring 1.0 by accident.
major_on_zero = false
allow_zero_version = true
