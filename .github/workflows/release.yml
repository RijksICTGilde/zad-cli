name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  # Needed to start the binary build by name. Without it that step ends in
  # "HTTP 403: Resource not accessible" and the whole release reads as failed while the
  # release itself succeeded -- the worst combination, because the red is real and the thing
  # it points at is not.
  actions: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # RELEASE_TOKEN (a PAT with repo scope) is needed to push the
          # version-bump commit through branch protection. Falls back to
          # GITHUB_TOKEN which works when branch protection allows it.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install python-semantic-release
        run: uv tool install python-semantic-release

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: semantic-release version --changelog --push --tag --vcs-release

      # Asked for by name rather than left to the tag push. A tag pushed with the default
      # GITHUB_TOKEN does not start another workflow, so relying on `on: push: tags` would
      # mean the binaries silently stop being built the day RELEASE_TOKEN is not set.
      - name: Build the standalone binaries for this tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(git describe --tags --abbrev=0)
          # A tag pushed with RELEASE_TOKEN (a PAT) starts this workflow by itself; one
          # pushed with GITHUB_TOKEN does not, which is why the step exists at all. So ask
          # first: dispatching on top of a run that is already going builds everything twice
          # and uploads the second copy over the first.
          if gh run list --workflow=release-binaries.yml --branch "$TAG" --limit 1 \
               --json databaseId --jq 'length' | grep -q '^[1-9]'; then
            echo "The tag push already started the binary build for $TAG."
            exit 0
          fi
          echo "Building binaries for $TAG"
          gh workflow run release-binaries.yml --ref "$TAG" -f tag="$TAG"
